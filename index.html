<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>iPhone Music</title>

<style>
body {
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:-apple-system, Arial;
}

/* IPHONE */
.iphone {
  width:320px;
  height:640px;
  border-radius:40px;
  background:black;
  padding:10px;
}

.screen {
  width:100%;
  height:100%;
  border-radius:30px;
  overflow:hidden;
  position:relative;
}

/* LOCK */
.lock {
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#ff00cc,#3333ff);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-align:center;
}

.time {font-size:40px;margin-top:40px;}

.unlock {
  margin:20px;
  padding:10px;
  background:rgba(255,255,255,0.2);
  border-radius:20px;
  cursor:pointer;
}

/* HOME */
.home {
  display:none;
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#ff512f,#dd2476,#24c6dc);
  padding:20px;
}

/* ICONA APP */
.app-icon {
  width:70px;
  text-align:center;
  color:white;
  font-size:12px;
  cursor:pointer;
}

.icon-box {
  width:60px;
  height:60px;
  border-radius:15px;
  overflow:hidden;
  margin:auto;
}

/* 📌 QUI METTI IL LINK DELLA TUA ICONA */
.icon-box img {
  width:100%;
  height:100%;
  object-fit:cover;
}

/* APP MUSIC */
.music-app {
  display:none;
  position:absolute;
  width:100%;
  height:100%;
  background:#000;
  color:white;
  overflow-y:auto; /* 🔥 SCROLL */
  padding:15px;
}

.back {
  color:#0af;
  cursor:pointer;
  margin-bottom:10px;
}

/* GRID MUSICA */
.grid {
  display:grid;
  grid-template-columns: repeat(2, 1fr); /* 2 colonne */
  gap:15px;
}

.album {
  cursor:pointer;
}

.album img {
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
}

.album-title {
  font-size:13px;
  margin-top:5px;
}

.album-artist {
  font-size:11px;
  color:#aaa;
}

audio {
  width:100%;
  margin-top:10px;
}
</style>

</head>

<body>

<div class="iphone">
<div class="screen">

<!-- LOCK -->
<div class="lock" id="lock">
  <div class="time" id="time"></div>
  <div class="unlock" onclick="unlock()">Sblocca</div>
</div>

<!-- HOME -->
<div class="home" id="home">

  <div class="app-icon" onclick="openMusic()">

    <!-- 📌 QUI METTI ICONA -->
    <!-- SOSTITUISCI IL LINK SOTTO CON IL TUO -->
    <div class="icon-box">
      <img src="https://raw.githubusercontent.com/mondezzarara/image-storage/main/Apple_Music_icon.svg.png">
    </div>

    Musica
  </div>

</div>

<!-- MUSIC APP -->
<div class="music-app" id="music">

<div class="back" onclick="goHome()">← Home</div>
<h2>Ascolta ora</h2>

<div class="grid" id="albums"></div>

<audio id="player" controls>
  <source id="source" src="" type="audio/mpeg">
</audio>

</div>

</div>
</div>

<script>

// ORARIO
function updateTime(){
  let now=new Date();
  let h=now.getHours().toString().padStart(2,'0');
  let m=now.getMinutes().toString().padStart(2,'0');
  document.getElementById("time").innerText=h+":"+m;
}
setInterval(updateTime,1000);
updateTime();

// NAV
function unlock(){
  document.getElementById("lock").style.display="none";
  document.getElementById("home").style.display="block";
}

function openMusic(){
  document.getElementById("home").style.display="none";
  document.getElementById("music").style.display="block";
}

function goHome(){
  document.getElementById("music").style.display="none";
  document.getElementById("home").style.display="block";
}

////////////////////////////////////////////////////
// 🎧 QUI AGGIUNGI LE CANZONI
////////////////////////////////////////////////////

const songs = [

/*
👇 COME AGGIUNGERE:

{
  title: "Nome",
  artist: "Artista",
  src: "LINK MP3",
  cover: "LINK IMMAGINE"
}
*/

{
  title: "Idee Valide",
  artist: "Marticagna",
  src: "https://raw.githubusercontent.com/mondezzarara/music-storage/main/IdeeValide.mp3",
  cover: "https://picsum.photos/300?1"
},

{
  title: "Seconda",
  artist: "Tu",
  src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
  cover: "https://picsum.photos/300?2"
}

];

////////////////////////////////////////////////////

// CREA GRID
function loadSongs(){
  const container=document.getElementById("albums");

  songs.forEach(song=>{
    const div=document.createElement("div");
    div.className="album";

    div.innerHTML=`
      <img src="${song.cover}">
      <div class="album-title">${song.title}</div>
      <div class="album-artist">${song.artist}</div>
    `;

    div.onclick=()=>playSong(song.src);

    container.appendChild(div);
  });
}

// PLAYER
function playSong(src){
  const player=document.getElementById("player");
  const source=document.getElementById("source");

  source.src=src;
  player.load();
  player.play();
}

// INIT
loadSongs();

</script>

</body>
</html>
