<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>iPhone Music</title>

<style>
body {
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:-apple-system, Arial;
}

/* IPHONE */
.iphone {
  width:320px;
  height:640px;
  border-radius:40px;
  background:black;
  padding:10px;
}

.screen {
  width:100%;
  height:100%;
  border-radius:30px;
  overflow:hidden;
  position:relative;
}

/* LOCK */
.lock {
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(#1e3c72,#2a5298);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-align:center;
}

.time {font-size:40px;margin-top:40px;}

.unlock {
  margin:20px;
  padding:10px;
  background:rgba(255,255,255,0.2);
  border-radius:20px;
  cursor:pointer;
}

/* HOME */
.home {
  display:none;
  position:absolute;
  width:100%;
  height:100%;
  background:url("https://picsum.photos/400/800?blur=3");
  background-size:cover;
  padding:20px;
}

/* ICONA APP */
.app-icon {
  width:65px;
  text-align:center;
  color:white;
  font-size:12px;
  cursor:pointer;
}

.icon-box {
  width:60px;
  height:60px;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:auto;
  font-size:25px;
}

/* icona musica stile iPhone */
.music-icon {
  background:linear-gradient(135deg,#ff2d55,#ff9500);
}

/* APP MUSIC */
.music-app {
  display:none;
  position:absolute;
  width:100%;
  height:100%;
  background:#000;
  color:white;
  overflow:auto;
  padding:15px;
}

.back {
  color:#0af;
  cursor:pointer;
  margin-bottom:10px;
}

/* stile apple music */
.album {
  margin-bottom:20px;
  cursor:pointer;
}

.album img {
  width:100%;
  border-radius:12px;
}

.album-title {
  margin-top:5px;
  font-size:14px;
}

.album-artist {
  font-size:12px;
  color:#aaa;
}

audio {
  width:100%;
  margin-top:10px;
}
</style>

</head>

<body>

<div class="iphone">
<div class="screen">

<!-- LOCK -->
<div class="lock" id="lock">
  <div class="time" id="time"></div>
  <div class="unlock" onclick="unlock()">Sblocca</div>
</div>

<!-- HOME -->
<div class="home" id="home">

  <div class="app-icon" onclick="openMusic()">
    <div class="icon-box music-icon">🎵</div>
    Musica
  </div>

</div>

<!-- MUSIC APP -->
<div class="music-app" id="music">

<div class="back" onclick="goHome()">← Home</div>
<h2>Ascolta ora</h2>

<div id="albums"></div>

<audio id="player" controls>
  <source id="source" src="" type="audio/mpeg">
</audio>

</div>

</div>
</div>

<script>

// ORARIO
function updateTime(){
  let now=new Date();
  let h=now.getHours().toString().padStart(2,'0');
  let m=now.getMinutes().toString().padStart(2,'0');
  document.getElementById("time").innerText=h+":"+m;
}
setInterval(updateTime,1000);
updateTime();

// NAV
function unlock(){
  document.getElementById("lock").style.display="none";
  document.getElementById("home").style.display="block";
}

function openMusic(){
  document.getElementById("home").style.display="none";
  document.getElementById("music").style.display="block";
}

function goHome(){
  document.getElementById("music").style.display="none";
  document.getElementById("home").style.display="block";
}

////////////////////////////////////////////////////
// 🎧 QUI METTI LE TUE CANZONI
////////////////////////////////////////////////////

const songs = [

/*
👇 COME USARE:

title: nome canzone
artist: artista
src: link mp3
cover: link immagine copertina
*/

{
  title: "Idee Valide",
  artist: "Tu",
  src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
  cover: "https://picsum.photos/400?random=1"
}

];

////////////////////////////////////////////////////

// CREA LISTA STILE APPLE MUSIC
function loadSongs(){
  const container=document.getElementById("albums");

  songs.forEach(song=>{
    const div=document.createElement("div");
    div.className="album";

    div.innerHTML=`
      <img src="${song.cover}">
      <div class="album-title">${song.title}</div>
      <div class="album-artist">${song.artist}</div>
    `;

    div.onclick=()=>playSong(song.src);

    container.appendChild(div);
  });
}

// PLAYER
function playSong(src){
  const player=document.getElementById("player");
  const source=document.getElementById("source");

  source.src=src;
  player.load();
  player.play();
}

// INIT
loadSongs();

</script>

</body>
</html>
