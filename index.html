<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>iPhone Simulator</title>

<style>
body {
  margin: 0;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial;
}

.iphone {
  width: 300px;
  height: 600px;
  border-radius: 40px;
  background: black;
  padding: 10px;
}

.screen {
  width: 100%;
  height: 100%;
  border-radius: 30px;
  overflow: hidden;
  position: relative;
}

/* LOCK */
.lock-screen {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(#1e3c72, #2a5298);
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: center;
}

.time {
  font-size: 40px;
  margin-top: 40px;
}

.unlock {
  background: rgba(255,255,255,0.2);
  margin: 20px;
  padding: 10px;
  border-radius: 20px;
  cursor: pointer;
}

/* HOME */
.home {
  display: none;
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(#3a7bd5, #00d2ff);
  padding: 20px;
}

.apps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.app {
  background: white;
  border-radius: 15px;
  height: 60px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 12px;
  cursor: pointer;
}

/* APP */
.app-screen {
  display: none;
  position: absolute;
  width: 100%;
  height: 100%;
  background: white;
  padding: 20px;
}

.back {
  position: absolute;
  top: 10px;
  left: 10px;
  cursor: pointer;
  color: blue;
}
</style>

</head>
<body>

<div class="iphone">
  <div class="screen">

    <!-- LOCK -->
    <div class="lock-screen" id="lock">
      <div class="time" id="time"></div>
      <div class="unlock" onclick="unlock()">Scorri per sbloccare</div>
    </div>

    <!-- HOME -->
    <div class="home" id="home">
      <div class="apps">
        <div class="app" onclick="openApp('musica')">Musica</div>
      </div>
    </div>

    <!-- MUSICA -->
    <div class="app-screen" id="musica">
      <div class="back" onclick="goHome()">←</div>
      <h2>Musica</h2>

      <p>Tocca per riprodurre:</p>
      <div onclick="playSong()" style="color:blue;cursor:pointer;">
        ▶ Idee Valide
      </div>

      <audio id="player" controls style="width:100%;margin-top:20px;">
        <source id="source" src="" type="audio/mpeg">
      </audio>
    </div>

  </div>
</div>

<script>

// ORARIO
function updateTime() {
  let now = new Date();
  let h = now.getHours().toString().padStart(2,'0');
  let m = now.getMinutes().toString().padStart(2,'0');
  document.getElementById("time").innerText = h + ":" + m;
}
setInterval(updateTime,1000);
updateTime();

// SBLOCCO
function unlock(){
  document.getElementById("lock").style.display="none";
  document.getElementById("home").style.display="block";
}

// NAV
function openApp(id){
  document.getElementById("home").style.display="none";
  document.getElementById(id).style.display="block";
}

function goHome(){
  document.querySelectorAll(".app-screen").forEach(el=>el.style.display="none");
  document.getElementById("home").style.display="block";
}

// 🎵 PLAYER SICURO
function playSong(){
  const player = document.getElementById("player");
  const source = document.getElementById("source");

  source.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";

  player.load();   // 🔥 fondamentale su iPad
  player.play();
}

</script>

</body>
</html>
