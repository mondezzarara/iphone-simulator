<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>iPhone Music</title>

<style>
body {
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
}

.iphone {
  width:320px;
  height:640px;
  border-radius:40px;
  background:black;
  padding:10px;
}

.screen {
  width:100%;
  height:100%;
  border-radius:30px;
  overflow:hidden;
  position:relative;
}

/* LOCK */
.lock-screen {
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(#1e3c72,#2a5298);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-align:center;
}

.time {font-size:40px;margin-top:40px;}

.unlock {
  margin:20px;
  padding:10px;
  background:rgba(255,255,255,0.2);
  border-radius:20px;
  cursor:pointer;
}

/* HOME */
.home {
  display:none;
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(#000,#222);
  padding:20px;
}

.app {
  background:white;
  border-radius:15px;
  height:60px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

/* MUSIC APP */
.music {
  display:none;
  position:absolute;
  width:100%;
  height:100%;
  background:#000;
  color:white;
  padding:15px;
  overflow:auto;
}

.song {
  display:flex;
  align-items:center;
  margin-bottom:15px;
  cursor:pointer;
}

.song img {
  width:50px;
  height:50px;
  border-radius:8px;
  margin-right:10px;
}

.song-title {
  font-size:14px;
}

.back {
  color:#0af;
  cursor:pointer;
  margin-bottom:10px;
}

audio {
  width:100%;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="iphone">
<div class="screen">

<!-- LOCK -->
<div class="lock-screen" id="lock">
  <div class="time" id="time"></div>
  <div class="unlock" onclick="unlock()">Sblocca</div>
</div>

<!-- HOME -->
<div class="home" id="home">
  <div class="app" onclick="openMusic()">Musica</div>
</div>

<!-- MUSIC APP -->
<div class="music" id="music">

<div class="back" onclick="goHome()">← Home</div>
<h2>Musica</h2>

<!-- LISTA CANZONI -->
<div id="songList"></div>

<!-- PLAYER -->
<audio id="player" controls>
  <source id="source" src="" type="audio/mpeg">
</audio>

</div>

</div>
</div>

<script>

// ORARIO
function updateTime(){
  let now=new Date();
  let h=now.getHours().toString().padStart(2,'0');
  let m=now.getMinutes().toString().padStart(2,'0');
  document.getElementById("time").innerText=h+":"+m;
}
setInterval(updateTime,1000);
updateTime();

// NAV
function unlock(){
  document.getElementById("lock").style.display="none";
  document.getElementById("home").style.display="block";
}

function openMusic(){
  document.getElementById("home").style.display="none";
  document.getElementById("music").style.display="block";
}

function goHome(){
  document.getElementById("music").style.display="none";
  document.getElementById("home").style.display="block";
}

//////////////////////////////////////////////////////////////
// 🎧 QUI INSERISCI LE TUE CANZONI
//////////////////////////////////////////////////////////////

const songs = [

/*
⚠️ COME AGGIUNGERE CANZONI:

- title: nome canzone
- artist: artista
- src: LINK MP3
- cover: LINK IMMAGINE

ESEMPIO:
{
  title: "Nome",
  artist: "Artista",
  src: "https://link.mp3",
  cover: "https://link.jpg"
},
*/

{
  title: "Idee Valide",
  artist: "Marticagna",
  src: "https://raw.githubusercontent.com/mondezzarara/music-storage/main/IdeeValide.mp3",
  cover: "https://raw.githubusercontent.com/mondezzarara/image-storage/main/IMG_0355.jpg"
},


  title: "Song 2",
  artist: "Artista",
  src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
  cover: "https://picsum.photos/200?2"
},

// 👉 DUPLICA QUESTO BLOCCO FINO A 20 CANZONI

  title: "Song 3",
  artist: "Artista",
  src: "LINK_MP3",
  cover: "LINK_IMMAGINE"
},


  title: "Song 4",
  artist: "Artista",
  src: "LINK_MP3",
  cover: "LINK_IMMAGINE"
},

// continua fino a 20...
];

//////////////////////////////////////////////////////////////

// CREA LISTA
function loadSongs(){
  const list=document.getElementById("songList");

  songs.forEach((song)=>{
    const div=document.createElement("div");
    div.className="song";

    div.innerHTML=`
      <img src="${song.cover}">
      <div>
        <div class="song-title">${song.title}</div>
        <div style="font-size:12px;color:#aaa">${song.artist}</div>
      </div>
    `;

    div.onclick=()=>playSong(song.src);

    list.appendChild(div);
  });
}

// PLAYER
function playSong(src){
  const player=document.getElementById("player");
  const source=document.getElementById("source");

  source.src=src;
  player.load();   // 🔥 fondamentale
  player.play();
}

// INIT
loadSongs();

</script>

</body>
</html>
